<div id="app"></div>
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --border:#E6E3DC;
    --text:#1B1B18;
    --text-muted:#7A766E;
    --accent:#2F6F5E;
    --accent-soft:#E4EFEA;
    --warn:#C97F3D;
    --warn-soft:#F7EBDD;
    --over:#C1443C;
    --over-soft:#F7E2DF;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:32px;
  }
  .header{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    background:rgba(250,250,248,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .header .date{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .gear-btn{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .gear-btn:active{transform:scale(0.94);}
  .gear-btn.active{background:var(--accent-soft);border-color:var(--accent);}
  .gear-btn svg{width:18px;height:18px;stroke:var(--text);}

  .hero{
    margin:20px 20px 4px;
    padding:24px 20px 20px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .remaining-num{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:44px;
    font-weight:600;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .remaining-label{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .bar-track{
    margin-top:18px;
    height:10px;
    border-radius:999px;
    background:var(--border);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    background:var(--accent);
    transition:width .35s ease, background-color .35s ease;
  }
  .stats-row{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-muted);
  }
  .stats-row b{color:var(--text);font-weight:600;}

  .settings-panel{
    margin:12px 20px 0;
    padding:16px 18px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:var(--radius);
    display:none;
  }
  .settings-panel.open{display:block;}
  .settings-panel label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
  }
  .settings-row{display:flex;gap:8px;}
  .settings-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    font-size:16px;
    background:var(--surface);
    color:var(--text);
  }
  .settings-row button{
    padding:10px 16px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .settings-row button:active{opacity:0.85;}

  .section-label{
    margin:24px 20px 8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .entry-form{
    margin:0 20px;
    display:flex;
    gap:8px;
    padding:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .entry-form input{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    background:var(--bg);
    color:var(--text);
    min-width:0;
  }
  .entry-form input#food-name{flex:1;}
  .entry-form input#food-cal{width:78px;}
  .entry-form button{
    border:none;
    border-radius:10px;
    background:var(--text);
    color:#fff;
    font-weight:600;
    font-size:14px;
    padding:0 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  .entry-form button:active{opacity:0.85;}

  .entries-list{
    margin:12px 20px 0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .entry-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .entry-name{font-size:15px;font-weight:500;}
  .entry-time{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .entry-right{display:flex;align-items:center;gap:12px;}
  .entry-cal{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:14px;
    font-weight:600;
    color:var(--text-muted);
  }
  .del-btn{
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:var(--over-soft);
    color:var(--over);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .del-btn:active{transform:scale(0.9);}

  .empty-state{
    margin:12px 20px 0;
    padding:32px 20px;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:var(--radius);
    color:var(--text-muted);
    font-size:14px;
  }

  .loading{
    padding:40px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
  }
</style>

<script>
(function(){
  const app = document.getElementById('app');
  let state = {
    loading: true,
    goal: 2000,
    goalDraft: '2000',
    entries: [],
    settingsOpen: false,
    dateKey: null,
    error: null
  };

  function todayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function formatDateLabel(){
    return new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }

  function formatTime(ts){
    return new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  async function loadAll(){
    state.dateKey = todayKey();
    try{
      let settingsRes = null;
      try{ settingsRes = await window.storage.get('settings', false); }catch(e){ settingsRes = null; }
      if(settingsRes && settingsRes.value){
        try{
          const parsed = JSON.parse(settingsRes.value);
          if(parsed && typeof parsed.goal === 'number' && parsed.goal > 0){
            state.goal = parsed.goal;
          }
        }catch(e){}
      }
      state.goalDraft = String(state.goal);

      let entriesRes = null;
      try{ entriesRes = await window.storage.get('entries:' + state.dateKey, false); }catch(e){ entriesRes = null; }
      if(entriesRes && entriesRes.value){
        try{
          const parsed = JSON.parse(entriesRes.value);
          state.entries = Array.isArray(parsed) ? parsed : [];
        }catch(e){ state.entries = []; }
      } else {
        state.entries = [];
      }
    }catch(e){
      state.error = 'Could not load saved data. Starting fresh for this session.';
    }
    state.loading = false;
    render();
  }

  async function saveEntries(){
    try{
      await window.storage.set('entries:' + state.dateKey, JSON.stringify(state.entries), false);
    }catch(e){
      state.error = 'Entry saved locally but syncing failed. It may not persist.';
      render();
    }
  }

  async function saveGoal(){
    try{
      await window.storage.set('settings', JSON.stringify({goal: state.goal}), false);
    }catch(e){
      state.error = 'Goal updated but syncing failed. It may not persist.';
      render();
    }
  }

  function checkDateRollover(){
    const k = todayKey();
    if(k !== state.dateKey){
      loadAll();
    }
  }

  function addEntry(name, cal){
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      name: name,
      calories: cal,
      time: Date.now()
    };
    state.entries.push(entry);
    render();
    saveEntries();
  }

  function deleteEntry(id){
    state.entries = state.entries.filter(e => e.id !== id);
    render();
    saveEntries();
  }

  function consumedTotal(){
    return state.entries.reduce((sum,e) => sum + e.calories, 0);
  }

  function barColor(pct){
    if(pct > 100) return 'var(--over)';
    if(pct >= 80) return 'var(--warn)';
    return 'var(--accent)';
  }

  function render(){
    if(state.loading){
      app.innerHTML = '<div class="loading">Loading today\u2019s log\u2026</div>';
      return;
    }

    const consumed = consumedTotal();
    const remaining = state.goal - consumed;
    const pct = state.goal > 0 ? Math.min(100, Math.max(0,(consumed/state.goal)*100)) : 0;
    const overPct = consumed > state.goal;

    const entriesHtml = state.entries.length === 0
      ? '<div class="empty-state">No entries yet today. Add your first meal or snack below.</div>'
      : '<div class="entries-list">' + state.entries.slice().reverse().map(e => `
          <div class="entry-row">
            <div>
              <div class="entry-name">${escapeHtml(e.name)}</div>
              <div class="entry-time">${formatTime(e.time)}</div>
            </div>
            <div class="entry-right">
              <span class="entry-cal">${e.calories} kcal</span>
              <button class="del-btn" data-del="${e.id}" aria-label="Delete entry">\u2715</button>
            </div>
          </div>
        `).join('') + '</div>';

    app.innerHTML = `
      <div class="header">
        <div class="date">${formatDateLabel()}</div>
        <button class="gear-btn ${state.settingsOpen ? 'active' : ''}" id="settings-toggle" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <div class="hero">
        <div class="remaining-num" style="${overPct ? 'color:var(--over)' : ''}">${overPct ? '\u2212' : ''}${Math.abs(remaining).toLocaleString()}</div>
        <div class="remaining-label">${overPct ? 'kcal over goal' : 'kcal remaining'}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor((consumed/state.goal)*100)}"></div></div>
        <div class="stats-row">
          <span><b>${consumed.toLocaleString()}</b> consumed</span>
          <span><b>${state.goal.toLocaleString()}</b> goal</span>
        </div>
      </div>

      <div class="settings-panel ${state.settingsOpen ? 'open' : ''}">
        <label for="goal-input">Daily calorie goal</label>
        <div class="settings-row">
          <input id="goal-input" type="number" inputmode="numeric" min="1" value="${state.goalDraft}" />
          <button id="save-goal">Save</button>
        </div>
      </div>

      ${state.error ? `<div class="empty-state" style="margin-top:12px;color:var(--over);border-color:var(--over-soft);background:var(--over-soft);">${escapeHtml(state.error)}</div>` : ''}

      <div class="section-label">Add entry</div>
      <form class="entry-form" id="entry-form">
        <input id="food-name" type="text" placeholder="Food name" autocomplete="off" required />
        <input id="food-cal" type="number" inputmode="numeric" placeholder="kcal" min="0" required />
        <button type="submit">Add</button>
      </form>

      <div class="section-label">Today\u2019s log</div>
      ${entriesHtml}
    `;

    document.getElementById('settings-toggle').onclick = () => {
      state.settingsOpen = !state.settingsOpen;
      render();
    };

    document.getElementById('save-goal').onclick = () => {
      const input = document.getElementById('goal-input');
      const val = parseInt(input.value, 10);
      if(!isNaN(val) && val > 0){
        state.goal = val;
        state.goalDraft = String(val);
        state.settingsOpen = false;
        state.error = null;
        render();
        saveGoal();
      }
    };

    document.getElementById('entry-form').onsubmit = (ev) => {
      ev.preventDefault();
      const nameInput = document.getElementById('food-name');
      const calInput = document.getElementById('food-cal');
      const name = nameInput.value.trim();
      const cal = parseInt(calInput.value, 10);
      if(name && !isNaN(cal) && cal >= 0){
        state.error = null;
        addEntry(name, cal);
      }
    };

    app.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => deleteEntry(btn.getAttribute('data-del'));
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) checkDateRollover();
  });
  setInterval(checkDateRollover, 60000);

  loadAll();
})();
</script>
