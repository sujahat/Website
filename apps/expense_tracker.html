<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --ink:#15151B;
    --ink-soft:#767680;
    --ink-faint:#B4B4BC;
    --border:#EAEAEC;
    --accent:#3454D1;
    --accent-soft:#EEF1FC;
    --danger:#C4453B;
    --danger-soft:#FBEEED;

    --c-food:#E8A33D;
    --c-transport:#3B82C4;
    --c-bills:#C4453B;
    --c-entertainment:#8B5FBF;
    --c-other:#767680;

    --font-display:'Manrope', sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* ---------- Hero / Total ---------- */

  .hero{
    padding:4px 4px 24px;
  }

  .hero .date{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:10px;
  }

  .hero .total-label{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }

  .hero .total-amount{
    font-family:var(--font-display);
    font-weight:800;
    font-size:52px;
    line-height:1.05;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }

  .spend-meter{
    display:flex;
    height:6px;
    border-radius:4px;
    overflow:hidden;
    margin-top:16px;
    background:var(--border);
  }

  .spend-meter .seg{
    height:100%;
    transition:width 0.35s ease;
  }

  /* ---------- Cards ---------- */

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }

  .card h2{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    margin:0 0 14px;
    color:var(--ink);
  }

  /* ---------- Add form ---------- */

  .amount-row{
    display:flex;
    align-items:center;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    transition:border-color 0.15s ease;
  }

  .amount-row:focus-within{
    border-color:var(--accent);
  }

  .amount-row .currency{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    color:var(--ink-faint);
    margin-right:6px;
  }

  .amount-row input{
    border:none;
    outline:none;
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    font-variant-numeric:tabular-nums;
    width:100%;
    background:transparent;
    color:var(--ink);
  }

  .amount-row input::placeholder{
    color:var(--ink-faint);
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }

  .chip{
    border:1.5px solid var(--border);
    background:var(--surface);
    border-radius:999px;
    padding:9px 14px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .chip .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    flex-shrink:0;
  }

  .chip.selected{
    border-color:currentColor;
    background:var(--accent-soft);
    color:var(--ink);
  }

  .note-input{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-family:var(--font-body);
    font-size:15px;
    outline:none;
    margin-bottom:14px;
    transition:border-color 0.15s ease;
    color:var(--ink);
  }

  .note-input:focus{
    border-color:var(--accent);
  }

  .note-input::placeholder{
    color:var(--ink-faint);
  }

  .add-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    transition:opacity 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .add-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .add-btn:not(:disabled):active{
    transform:scale(0.98);
  }

  .form-error{
    font-size:13px;
    color:var(--danger);
    margin:-6px 0 12px;
    min-height:0;
  }

  /* ---------- Breakdown ---------- */

  .breakdown-row{
    margin-bottom:14px;
  }

  .breakdown-row:last-child{
    margin-bottom:0;
  }

  .breakdown-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    margin-bottom:6px;
  }

  .breakdown-top .label{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    color:var(--ink);
  }

  .breakdown-top .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex-shrink:0;
  }

  .breakdown-top .pct{
    font-variant-numeric:tabular-nums;
    color:var(--ink-soft);
    font-weight:600;
  }

  .bar-track{
    height:8px;
    background:var(--bg);
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--border);
  }

  .bar-fill{
    height:100%;
    border-radius:4px;
    transition:width 0.4s ease;
  }

  /* ---------- Expense list ---------- */

  .expense-list{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-height:360px;
    overflow-y:auto;
    margin:0 -6px;
    padding:0 6px;
  }

  .expense-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 6px;
    border-bottom:1px solid var(--border);
    animation:rowIn 0.25s ease;
  }

  .expense-row:last-child{
    border-bottom:none;
  }

  @keyframes rowIn{
    from{opacity:0; transform:translateY(-4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .expense-row .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
  }

  .expense-row .info{
    flex:1;
    min-width:0;
  }

  .expense-row .category{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }

  .expense-row .note{
    font-size:13px;
    color:var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-top:1px;
  }

  .expense-row .amount{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    white-space:nowrap;
  }

  .expense-row .delete-btn{
    border:none;
    background:var(--danger-soft);
    color:var(--danger);
    width:26px;
    height:26px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .expense-row .delete-btn:active{
    opacity:0.6;
  }

  .empty-state{
    font-size:14px;
    color:var(--ink-faint);
    text-align:center;
    padding:20px 0 6px;
  }

  .hidden{
    display:none !important;
  }

  .load-note{
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
    padding:40px 0;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="load-note" id="loadNote">Loading your expenses…</div>

  <div id="mainContent" class="hidden">

    <header class="hero">
      <div class="date" id="dateLabel"></div>
      <div class="total-label">Total spent today</div>
      <div class="total-amount" id="totalAmount">$0.00</div>
      <div class="spend-meter" id="spendMeter"></div>
    </header>

    <section class="card">
      <h2>Add an expense</h2>
      <div class="amount-row">
        <span class="currency">$</span>
        <input id="amountInput" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="chips" id="categoryChips"></div>
      <input id="noteInput" class="note-input" type="text" placeholder="Add a note (optional)" maxlength="80">
      <div class="form-error hidden" id="formError"></div>
      <button class="add-btn" id="addBtn" disabled>Add expense</button>
    </section>

    <section class="card" id="breakdownCard">
      <h2>Today's breakdown</h2>
      <div id="breakdownList"></div>
      <div class="empty-state" id="breakdownEmpty">Nothing to break down yet.</div>
    </section>

    <section class="card">
      <h2>Today's expenses</h2>
      <div class="expense-list" id="expenseList"></div>
      <div class="empty-state" id="listEmpty">No expenses logged today. Add your first one above.</div>
    </section>

  </div>
</div>

<script>
(function(){

  var CATEGORIES = [
    { key:'Food', color:'var(--c-food)', hex:'#E8A33D' },
    { key:'Transport', color:'var(--c-transport)', hex:'#3B82C4' },
    { key:'Bills', color:'var(--c-bills)', hex:'#C4453B' },
    { key:'Entertainment', color:'var(--c-entertainment)', hex:'#8B5FBF' },
    { key:'Other', color:'var(--c-other)', hex:'#767680' }
  ];

  var STORAGE_KEY = 'expenses';

  var allExpenses = [];
  var selectedCategory = null;

  var amountInput = document.getElementById('amountInput');
  var noteInput = document.getElementById('noteInput');
  var addBtn = document.getElementById('addBtn');
  var formError = document.getElementById('formError');
  var chipsWrap = document.getElementById('categoryChips');
  var expenseListEl = document.getElementById('expenseList');
  var listEmpty = document.getElementById('listEmpty');
  var breakdownList = document.getElementById('breakdownList');
  var breakdownEmpty = document.getElementById('breakdownEmpty');
  var totalAmountEl = document.getElementById('totalAmount');
  var spendMeter = document.getElementById('spendMeter');
  var dateLabel = document.getElementById('dateLabel');
  var loadNote = document.getElementById('loadNote');
  var mainContent = document.getElementById('mainContent');

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatMoney(n){
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function catInfo(key){
    for (var i=0;i<CATEGORIES.length;i++){
      if (CATEGORIES[i].key === key) return CATEGORIES[i];
    }
    return CATEGORIES[CATEGORIES.length-1];
  }

  function renderChips(){
    chipsWrap.innerHTML = '';
    CATEGORIES.forEach(function(cat){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (selectedCategory === cat.key ? ' selected' : '');
      chip.style.color = selectedCategory === cat.key ? cat.color : '';
      chip.innerHTML = '<span class="dot" style="background:' + cat.color + '"></span>' + cat.key;
      chip.addEventListener('click', function(){
        selectedCategory = cat.key;
        renderChips();
        updateAddBtnState();
      });
      chipsWrap.appendChild(chip);
    });
  }

  function updateAddBtnState(){
    var amt = parseFloat(amountInput.value);
    var valid = !isNaN(amt) && amt > 0 && !!selectedCategory;
    addBtn.disabled = !valid;
    formError.classList.add('hidden');
  }

  amountInput.addEventListener('input', updateAddBtnState);

  async function loadExpenses(){
    try {
      var res = await window.storage.get(STORAGE_KEY, false);
      allExpenses = res && res.value ? JSON.parse(res.value) : [];
    } catch(e) {
      allExpenses = [];
    }
  }

  async function persist(){
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(allExpenses), false);
    } catch(e) {
      formError.textContent = 'Could not save — please try again.';
      formError.classList.remove('hidden');
    }
  }

  function todaysExpenses(){
    var tk = todayKey();
    return allExpenses.filter(function(e){ return e.date === tk; })
      .sort(function(a,b){ return b.timestamp - a.timestamp; });
  }

  function render(){
    var today = todaysExpenses();
    var total = today.reduce(function(sum, e){ return sum + e.amount; }, 0);

    totalAmountEl.textContent = formatMoney(total);

    // Spend meter (signature strip under total)
    spendMeter.innerHTML = '';
    if (total > 0){
      CATEGORIES.forEach(function(cat){
        var catTotal = today.filter(function(e){ return e.category === cat.key; })
          .reduce(function(s,e){ return s + e.amount; }, 0);
        if (catTotal > 0){
          var seg = document.createElement('div');
          seg.className = 'seg';
          seg.style.width = ((catTotal/total)*100) + '%';
          seg.style.background = cat.color;
          spendMeter.appendChild(seg);
        }
      });
    }

    // Expense list
    expenseListEl.innerHTML = '';
    if (today.length === 0){
      listEmpty.classList.remove('hidden');
    } else {
      listEmpty.classList.add('hidden');
      today.forEach(function(e){
        var cat = catInfo(e.category);
        var row = document.createElement('div');
        row.className = 'expense-row';
        row.innerHTML =
          '<span class="dot" style="background:' + cat.color + '"></span>' +
          '<div class="info">' +
            '<div class="category">' + cat.key + '</div>' +
            (e.note ? '<div class="note">' + escapeHtml(e.note) + '</div>' : '') +
          '</div>' +
          '<div class="amount">' + formatMoney(e.amount) + '</div>' +
          '<button class="delete-btn" aria-label="Delete expense" data-id="' + e.id + '">✕</button>';
        expenseListEl.appendChild(row);
      });
      Array.prototype.forEach.call(expenseListEl.querySelectorAll('.delete-btn'), function(btn){
        btn.addEventListener('click', function(){
          deleteExpense(btn.getAttribute('data-id'));
        });
      });
    }

    // Breakdown
    breakdownList.innerHTML = '';
    if (total === 0){
      breakdownEmpty.classList.remove('hidden');
    } else {
      breakdownEmpty.classList.add('hidden');
      CATEGORIES.forEach(function(cat){
        var catTotal = today.filter(function(e){ return e.category === cat.key; })
          .reduce(function(s,e){ return s + e.amount; }, 0);
        if (catTotal === 0) return;
        var pct = (catTotal/total)*100;
        var row = document.createElement('div');
        row.className = 'breakdown-row';
        row.innerHTML =
          '<div class="breakdown-top">' +
            '<span class="label"><span class="dot" style="background:' + cat.color + '"></span>' + cat.key + '</span>' +
            '<span class="pct">' + formatMoney(catTotal) + ' · ' + pct.toFixed(0) + '%</span>' +
          '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + cat.color + '"></div></div>';
        breakdownList.appendChild(row);
      });
    }
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function deleteExpense(id){
    allExpenses = allExpenses.filter(function(e){ return String(e.id) !== String(id); });
    await persist();
    render();
  }

  addBtn.addEventListener('click', async function(){
    var amt = parseFloat(amountInput.value);
    if (isNaN(amt) || amt <= 0 || !selectedCategory) return;

    var entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
      amount: Math.round(amt * 100) / 100,
      category: selectedCategory,
      note: noteInput.value.trim(),
      date: todayKey(),
      timestamp: Date.now()
    };

    allExpenses.push(entry);
    await persist();

    amountInput.value = '';
    noteInput.value = '';
    selectedCategory = null;
    renderChips();
    updateAddBtnState();
    render();
  });

  function setDateLabel(){
    var d = new Date();
    dateLabel.textContent = 'Today, ' + d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  async function init(){
    setDateLabel();
    renderChips();
    updateAddBtnState();
    await loadExpenses();
    render();
    loadNote.classList.add('hidden');
    mainContent.classList.remove('hidden');
  }

  init();

})();
</script>

</body>
</html>
